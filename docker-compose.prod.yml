name: vulab

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: vulab-app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NUXT_HOST=0.0.0.0
      - NUXT_PORT=3000
      - NODE_OPTIONS=--max-old-space-size=768
    volumes:
      - tempmail_data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  tempmail_data:
