services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vuthanh-app
    ports:
      - "3005:3005"
    volumes:
      - .:/app
      - /app/node_modules
      - tempmail_data:/app/data
    env_file:
      - .env
    environment:
      - NUXT_HOST=0.0.0.0
      - NUXT_PORT=3005

volumes:
  tempmail_data: